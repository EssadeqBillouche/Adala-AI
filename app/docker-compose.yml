version: "3.9"

services:
  # =============================================================================
  # QDRANT - Vector Database with Hybrid Search
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # Qdrant Dashboard: http://localhost:6333/dashboard
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # AI ENGINE - AdalaAI Legal RAG Engine (FastAPI + LangGraph)
  # =============================================================================
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: ai-engine
    env_file:
      - ./ai-engine/.env
    depends_on:
      qdrant:
        condition: service_healthy
    # No ports exposed - internal only via backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # BACKEND - NestJS Orchestration Layer
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Connect to ai engine via docker DNS:
      AI_ENGINE_URL: http://ai-engine:8000
    # Also removed port 3001 binding: Nginx handles external traffic!
    depends_on:
      - ai-engine
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      NODE_ENV: production
    # Also removed port 3000 binding: Nginx handles external traffic!
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"  # ONLY Nginx is exposed to the outside world
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  qdrant_storage:
    driver: local
