version: "3.9"

services:
  # =============================================================================
  # QDRANT - Vector Database with Hybrid Search
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | head -1 | grep -q '200' && exec 3>&- || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # AI ENGINE - AdalaAI Legal RAG Engine (FastAPI + LangGraph)
  # =============================================================================
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: ai-engine
    env_file:
      - ./ai-engine/.env
    volumes:
      # Mount pre-downloaded model cache so the container starts instantly
      # without needing to download ~3 GB of models at runtime.
      - ./ai-engine/.model-cache/huggingface:/root/.cache/huggingface:ro
      - ./ai-engine/.model-cache/fastembed:/root/.cache/fastembed:ro
    depends_on:
      qdrant:
        condition: service_started
    # No ports exposed - internal only via backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # BACKEND - NestJS Orchestration Layer
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Connect to ai engine via docker DNS:
      AI_ENGINE_URL: http://ai-engine:8000
    # Also removed port 3001 binding: Nginx handles external traffic!
    depends_on:
      - ai-engine
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      NODE_ENV: production
    # Also removed port 3000 binding: Nginx handles external traffic!
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"  # ONLY Nginx is exposed to the outside world
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  qdrant_storage:
    driver: local
